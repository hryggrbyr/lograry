      // Helper function to update draft fields via Decap CMS Redux store
      function updateDraftFields(payload) {
        const cms = window.CMS;
        if (!cms) {
          console.error("CMS not available");
          return false;
        }

        const store = cms?.store;
        if (!store) {
          console.error("CMS store not available");
          return false;
        }

        try {
          const state = store.getState();
          const draftData = state?.entryDraft?.entry?.data || {};
          const merged = { ...draftData, ...payload };

          store.dispatch({
            type: "ENTRY_DRAFT_UPDATE",
            payload: { data: merged },
          });

          return true;
        } catch (error) {
          console.error("Failed to update draft fields:", error);
          return false;
        }
      }

      // Helper to normalize date formats
      function normalizeDate(value) {
        if (!value) return "";
        if (/^\d{4}$/.test(value)) return `${value}-01-01`;
        if (/^\d{4}-\d{2}$/.test(value)) return `${value}-01`;
        return value;
      }

      // Main function to apply fetched data to editor fields via Redux
      async function applyToFields() {
        try {
          // Parse YAML and suppress warnings by catching console output
          let data;
          const originalWarn = console.warn;
          console.warn = function (...args) {
            // Suppress YAML warnings but allow other warnings through
            if (!String(args[0]).includes("YAML")) {
              originalWarn.apply(console, args);
            }
          };
          data = jsyaml.load(yamlString);
          console.warn = originalWarn;
          console.log("YAML Data being applied:", data);

          // Normalize date fields and convert nested structures to plain objects
          const processedData = {};
          const deepCopy = (obj) => {
            if (obj instanceof Map) {
              return Object.fromEntries(
                Array.from(obj.entries()).map(([k, v]) => [k, deepCopy(v)]),
              );
            }
            if (Array.isArray(obj)) {
              return obj.map(deepCopy);
            }
            if (obj !== null && typeof obj === "object") {
              return Object.entries(obj).reduce((acc, [k, v]) => {
                acc[k] = deepCopy(v);
                return acc;
              }, {});
            }
            return obj;
          };
          for (const [key, value] of Object.entries(data)) {
            if (key === "published") {
              processedData[key] = normalizeDate(value);
            } else {
              processedData[key] = deepCopy(value);
            }
          }

          // Use Redux dispatch to update all fields at once
          const success = updateDraftFields(processedData);

          if (success) {
            console.log("Successfully updated draft fields via Redux");
            setTimeout(() => {
              hideBookPreview();
            }, 300);
          } else {
            throw new Error("Redux dispatch failed");
          }
        } catch (error) {
          console.error("Failed to populate fields:", error);
          alert(`Failed to populate fields: ${error.message}`);
        }
      }

          const data = await res.json();

          if (!data.items || data.items.length === 0) {

            return null;
          }

          const b = data.items[0].volumeInfo;
          return {
            type: "book",
            title: b.title || "",
            subtitle: b.subtitle || "",
            author: b.authors ? b.authors.join(", ") : "",
            published: b.publishedDate || "",
            publisher: b.publisher || "",
            page_count: b.pageCount || "",
            isbn: isbn,
            coverUrl: b.imageLinks?.thumbnail || "",
            shelf: "to-read",
            owned: false,
            rating: 0,
            body: b.description || "",
          };
        } catch (error) {
          console.error("Failed to fetch book data:", error);
          return null;

      // Helper to fetch movie data from IMDb mirror
      async function getFullMovieData(title) {

            `https://imdb.iamidiotareyoutoo.com/search?q=${encodeURIComponent(title)}`,

          // STEP 2: Fetch detailed info (Director, Runtime, Genres)

          // STEP 3: Map to your specific fields
          const short = details?.short || {};
          const actorsFromShort = Array.isArray(short.actor)

            : [];
          const actorsFromBasic = basicInfo["#ACTORS"]
            ? basicInfo["#ACTORS"].split(", ").map((s) => s.trim())
            : [];

          return {

      // Helper to convert ISO 8601 duration (PT1H48M) to readable string (1h 48m)
      function formatDuration(iso) {
        if (!iso || typeof iso !== "string") return "";
        return iso

          .replace(/H/, "h ")
          .replace(/M/, "m")
