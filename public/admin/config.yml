# 1. Backend: Tell Sveltia where to push commits
backend:
  name: github
  repo: hryggrbyr/lograry # Important: Update this!
  branch: main

# 2. Media: Tell Sveltia where to save cover images
# public/images/covers will show up as /images/covers in your Astro code
media_folder: "public/images/covers"
public_folder: "/lograry/images/covers"

# 3. Content: Map your data fields
collections:
  - name: "books"
    label: "Library"
    folder: "src/content/books"
    extension: "md" # or "mdx"
    format: "frontmatter"
    create: true
    slug: "{{slug}}-{{author.0}}"
    fields:
      - { label: "type", name: "type", widget: "string", default: "book" }
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Subtitle",
          name: "subtitle",
          widget: "string",
          required: false,
        }

      - label: "Authors"
        name: "author"
        widget: "list"

      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        create: true
        required: false
        options:
          - "Addiction"
          - "Adventure"
          - "Aliens"
          - "AlternateHistory"
          - "America"
          - "Americana"
          - "Anthropology"
          - "Biography"
          - "BlackComedy"
          - "Bleak"
          - "Boys"
          - "BritishLiterature"
          - "Charming"
          - "Childhood"
          - "Classic"
          - "Code"
          - "Comedy"
          - "ComingOfAge"
          - "Crime"
          - "Cyberpunk"
          - "DarkComedy"
          - "DarkFantasy"
          - "Darkhumour"
          - "Demons"
          - "Design"
          - "Detective"
          - "Dragons"
          - "Drama"
          - "DrugSmuggling"
          - "Dystopia"
          - "England"
          - "Environment"
          - "Epic"
          - "Espionage"
          - "Family"
          - "Fantasy"
          - "Fiction"
          - "Folklore"
          - "Gentle"
          - "Ghosts"
          - "Goblins"
          - "HistoricalFantasy"
          - "HistoricalFiction"
          - "History"
          - "Horror"
          - "Hospital"
          - "Iceland"
          - "Ireland"
          - "Japan"
          - "JuvenileFiction"
          - "LGBT"
          - "Library"
          - "Magic"
          - "MagicalSchool"
          - "Medical"
          - "Military"
          - "ModernFairyTale"
          - "ModernFairytale"
          - "Music"
          - "Mystery"
          - "Mythology"
          - "Neurodivergent"
          - "Nonfiction"
          - "Norway"
          - "NovellaCollection"
          - "OpinionColumn"
          - "ParallelWorlds"
          - "Pirates"
          - "Police"
          - "PoliceProcedural"
          - "Politics"
          - "Postapocalyptic"
          - "Prison"
          - "Psychology"
          - "Publishing"
          - "Quest"
          - "Relationships"
          - "Religion"
          - "Romance"
          - "Romantasy"
          - "Satire"
          - "Scandinoir"
          - "Sci-fi"
          - "Science"
          - "Scotland"
          - "ScottishLiterature"
          - "SerialKiller"
          - "ShortStories"
          - "Software"
          - "Space"
          - "Steampunk"
          - "Suicide"
          - "Supernatural"
          - "Suspense"
          - "Sweden"
          - "SwordAndSorcery"
          - "TalkingAnimals"
          - "Thriller"
          - "TimeTravel"
          - "TransgressiveFiction"
          - "UrbanFantasy"
          - "Vampires"
          - "War"
          - "Werewolves"
          - "Witches"
          - "Wizards"
          - "WorkingClass"
          - "YoungAdult"
          - "Zombies"
          - "fantasy"
          - "folklore"
          - "juvenile fiction"
          - "lgbt"
          - "magic"
          - "mythology"
          - "romance"
          - "urban fantasy"
          - "wizards"

      - label: "Shelf"
        name: "shelf"
        widget: "select"
        options: ["to-read", "reading", "read", "abandoned"]

      - { label: "Owned?", name: "owned", widget: "boolean", default: false }

      # Date handling: using YYYY-MM-DD for your smartDate compatibility
      - {
          label: "Start Date",
          name: "start_date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          time_format: false,
          required: false,
        }
      - {
          label: "End Date",
          name: "end_date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          time_format: false,
          required: false,
        }
      - {
          label: "Published Date",
          name: "published",
          widget: "datetime",
          format: "YYYY-MM-DD",
          time_format: false,
          required: false,
        }
      - {
          label: "Created",
          name: "created",
          widget: "datetime",
          format: "YYYY-MM-DD",
          time_format: false,
          required: false,
        }

      - {
          label: "Rating",
          name: "rating",
          widget: "number",
          value_type: "int",
          min: 0,
          max: 5,
          required: false,
        }
      - {
          label: "Publisher",
          name: "publisher",
          widget: "string",
          required: false,
        }
      - {
          label: "Page Count",
          name: "page_count",
          widget: "number",
          value_type: "int",
          required: false,
        }
      - { label: "ISBN", name: "isbn", widget: "string", required: false }
      - {
          label: "Cover URL",
          name: "coverUrl",
          widget: "string",
          required: false,
        }

      # Nested Object: Recommended By
      - label: "Recommended By"
        name: "recommended_by"
        widget: "object"
        required: false
        collapsed: false
        default: { "name": "", "url": "" }
        fields:
          - { label: "Name", name: "name", widget: "string", required: false }
          - { label: "URL", name: "url", widget: "string", required: false }

      - {
          label: "Review URL",
          name: "reviewUrl",
          widget: "string",
          required: false,
        }
      - {
          label: "Bookshop URL",
          name: "bookshopUrl",
          widget: "string",
          required: false,
        }

      # The Markdown body
      - {
          label: "Notes/Review Body",
          name: "body",
          widget: "markdown",
          required: false,
        }

  - name: "movies"
    label: "Blockbuster"
    folder: "src/content/movies"
    extension: "md"
    format: "frontmatter"
    create: true
    slug: "{{slug}}-{{director}}-{{year}}"
    fields:
      - { label: "type", name: "type", widget: "string", default: "movie" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Country", name: "country", widget: "string", required: false }
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - label: "Director"
        name: "director"
        widget: "string"
        min: 1
      - label: "Actors"
        name: "actors"
        widget: "list"
      - label: "Genre"
        name: "genre"
        widget: "select"
        multiple: true
        create: true
        required: false
      - { label: "Length", name: "length", widget: "string", required: false }
      - label: "Shelf"
        name: "shelf"
        widget: "select"
        options: ["watchlist", "watching", "watched"]
      - { label: "Owned?", name: "owned", widget: "boolean", default: false }
      - {
          label: "Rating",
          name: "rating",
          widget: "number",
          value_type: "int",
          min: 0,
          max: 5,
          required: false,
        }
      - {
          label: "Watched Date",
          name: "watched",
          widget: "datetime",
          format: "YYYY-MM-DD",
          time_format: false,
          required: false,
        }
      - {
          label: "Poster URL",
          name: "poster",
          widget: "string",
          required: false,
        }
      - {
          label: "Notes/Review Body",
          name: "body",
          widget: "markdown",
          required: false,
        }

  - name: "series"
    label: "Redux"
    folder: "src/content/series"
    extension: "md"
    format: "frontmatter"
    create: true
    slug: "{{slug}}-{{director}}-{{year}}"
    fields:
      - { label: "type", name: "type", widget: "string", default: "series" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Country", name: "country", widget: "string", required: false }
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - label: "Director"
        name: "director"
        widget: "string"
        required: false
      - label: "Actors"
        name: "actors"
        widget: "list"
        required: false
      - label: "Genre"
        name: "genre"
        widget: "select"
        multiple: true
        create: true
        required: false
      - { label: "Length", name: "length", widget: "string", required: false }
      - label: "Shelf"
        name: "shelf"
        widget: "select"
        options: ["watchlist", "watching", "watched"]
      - { label: "Owned?", name: "owned", widget: "boolean", default: false }
      - {
          label: "Rating",
          name: "rating",
          widget: "number",
          value_type: "int",
          min: 0,
          max: 5,
          required: false,
        }
      - {
          label: "Watched Date",
          name: "watched",
          widget: "datetime",
          format: "YYYY-MM-DD",
          time_format: false,
          required: false,
        }
      - {
          label: "Poster URL",
          name: "poster",
          widget: "string",
          required: false,
        }
      - {
          label: "Notes/Review Body",
          name: "body",
          widget: "markdown",
          required: false,
        }
