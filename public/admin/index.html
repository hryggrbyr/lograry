<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/decap-cms@3.0.0/dist/decap-cms.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #333;
      }
      body {
        background: #f9f9f9;
      }
      #nc-root,
      #cms-root {
        height: 100%;
        width: 100%;
      }
      button,
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: inherit;
      }
    </style>
  </head>
  <body>
    <div id="nc-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.0.0/dist/decap-cms.js"></script>

    <script>
      // Initialize Decap CMS
      (function initCMS() {
        if (window.CMS && typeof window.CMS.init === "function") {
          try {
            window.CMS.init({
              config: {
                load_config_file: true,
              },
            });
          } catch (error) {
            console.error("CMS init error:", error);
            setTimeout(initCMS, 500);
          }
        } else {
          setTimeout(initCMS, 100);
        }
      })();
    </script>
  </body>
</html>
